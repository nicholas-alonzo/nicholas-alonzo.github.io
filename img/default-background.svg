<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ripple {
        animation: ripple 3s infinite;
      }
      @keyframes ripple {
        0% { r: 50; opacity: 1; }
        100% { r: 200; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Water droplets with ripple effect -->
  <!-- top left -->
  <circle cx="50" cy="74" r="60" fill="skyblue" class="ripple" style="animation-duration: 6s;" />
  <!-- top right -->
  <circle cx="1900" cy="100" r="80" fill="skyblue" class="ripple" style="animation-duration: 6.5s;" />
  <!-- bottom left -->
  <circle cx="250" cy="800" r="60" fill="skyblue" class="ripple" style="animation-duration: 7s;" />
  <!-- bottom right -->
  <circle cx="1900" cy="800" r="60" fill="skyblue" class="ripple" style="animation-duration: 7.5s;" />
  <!-- bottom center -->
  <circle cx="1200" cy="1000" r="60" fill="skyblue" class="ripple" style="animation-duration: 8s;" />
  <!-- next to profile picture -->
  <circle cx="955" cy="280" r="100" fill="skyblue" class="ripple" style="animation-duration: 8.5s;" />
  
</svg>