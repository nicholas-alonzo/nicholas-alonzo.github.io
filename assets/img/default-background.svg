<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ripple {
        animation: ripple 3s infinite;
      }
      @keyframes ripple {
        0% { r: 50; opacity: 1; }
        100% { r: 200; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Water droplets with ripple effect -->
  <circle cx="100" cy="900" r="50" fill="skyblue" class="ripple" style="animation-duration: 5.2s;" />
  <circle cx="900" cy="250" r="30" fill="skyblue" class="ripple" style="animation-duration: 5s;" />
  <circle cx="350" cy="550" r="60" fill="skyblue" class="ripple" style="animation-duration: 6s;" />
  <circle cx="1200" cy="1000" r="40" fill="skyblue" class="ripple" style="animation-duration: 4s;" />
  <circle cx="1500" cy="350" r="70" fill="skyblue" class="ripple" style="animation-duration: 3.5s;" />
  
  <circle cx="1900" cy="100" r="80" fill="skyblue" class="ripple" style="animation-duration: 4.4;" />
  <circle cx="1900" cy="800" r="95" fill="skyblue" class="ripple" style="animation-duration: 4.2s;" />
  <circle cx="10" cy="74" r="90" fill="skyblue" class="ripple" style="animation-duration: 5.5s;" />
</svg>